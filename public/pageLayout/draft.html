<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Draft</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="nav-bar">
      <a href="" class="nav-item">Personal Warerobe</a>
      <a href="" class="nav-item">Outfit Hallway</a>
    </div>

    <div class="filter-box">
      <div class="filter-box-category">
        <span style="font-size: 30px; padding-left: 10px">Category</span>
        <button class="category-option selected" value="allCategory">
          All
        </button>
        <button class="category-option" value="top">Top</button>
        <button class="category-option" value="bottom">Bottom</button>
        <button class="category-option" value="hat">Hat</button>
        <button class="category-option" value="footwear">Footwear</button>
        <button class="category-option" value="accessory">Accessory</button>
      </div>

      <div class="filter-box-color   ">
        <span style="font-size: 30px; padding-left: 10px">Color</span>
        <select name="color-options" id="color-options">
          <!-- To allow multiple colors, checkbox with hidden nav is required-->
          <option value="allColor"></option>
          <option value="lightblue">Blue</option>
          <option value="white">White</option>
          <option value="gray">Gray</option>
          <option value="pink">Pink</option>
          <option value="lightcoral">Orange</option>
          <option value="tan">Brown</option>
          <option value="mediumaquamarine">Green</option>
        </select>
      </div>
    </div>

    <div class="content-container">
      <h1>Welcome back to your Warerobe</h1>
      <div class="warerobe-grid">
        <!-- This one for js where auto create grid form to show each garment -->
      </div>
    </div>

    <div class="outfit-combination">
      <!-- This one is for showing garments when
       choosing from the warerobe-grid
       But maybe best if this is for different site
       and all the search bar and item list is on the nav bar-->
    </div>

    <div class="upload-card-container hidden">
      <button class="close-upload-card-button">&times;</button>
      <h1 style="margin: 0; margin-top: 5px">Add a garment</h2>
      <form method="POST" class="upload-form">
        <label for="upload-card-garment-image">Garment image</label>
        <input
          type="file"
          id="upload-card-garment-image"
          accept="image/png,image/jpeg,image/webp"
          required
        />

        <label for="upload-card-garment-name">Garment name</label>
        <input
          type="text"
          placeholder="e.g. Sweaters / Nike pants"
          id="upload-card-garment-name"
        />

        <div class="upload-card-garment-category-color-section">
          <div class="upload-card-garment-category-section">
            <label for="upload-card-garment-category">Category</label>
        <select
          name="upload-card-garment-category"
          id="upload-card-garment-category"
          required
        >
          <option value="" selected disabled></option>
          <option value="Tops">Tops</option>
          <option value="Bottoms">Bottoms</option>
          <option value="Dresses">Dresses</option>
          <option value="Hat">Hat</option>
          <option value="Footwear">Footwear</option>
          <option value="Accessory">Accessory</option>
        </select>
          </div>
          <div class="upload-card-garment-color-section">
            <label for="upload-card-garment-color">Color</label>
        <select
          name="upload-card-garment-color"
          id="upload-card-garment-color"
          required
        >
          <option value="" selected disabled></option>
          <option value="Black">Black</option>
          <option value="White">White</option>
          <option value="Pink">Pink</option>
          <option value="Blue">Blue</option>
          <option value="Grey">Grey</option>
          <option value="Green">Green</option>
          <option value="Red">Red</option>
          <option value="Yellow">Yellow</option>
          <option value="Brown">Brown</option>
          <option value="Purple">Purple</option>
          <option value="Orange">Orange</option>
        </select>
          </div>

        </div>

        <button class="upload-card-add-button">Add to warerobe</button>
      </form>
    </div>

    <!-- JavaScript -->
    <script src="../script.js"></script>
  </body>
</html>
