<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login page</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="body-authPage">
    <!-- Login -->
    <div class="login-card">
      <h3>Log in to Digital Warerobe</h3>
      <form method="POST">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" />
        <label for="password">Password</label>
        <input type="password" name="password" id="password" />

        <button class="submit" type="submit">Log In</button>
      </form>
    </div>

    <!-- Register -->
    <div class="register-card hidden">
      <h3>Sign up to Digital Warerobe</h3>
      <form method="POST">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" />
        <label for="password">Password</label>
        <input type="password" name="password" id="password" />
        <label for="confirm-password">Confirm password</label>
        <input type="password" name="confirm-password" id="confirm-password" />

        <button class="submit" type="submit">Create account</button>
      </form>
    </div>

    <!-- Changing mode button -->
    <div class="auth-change-mode-section">
      <p>New to Digital Warerobe</p>
      <button class="auth-change-mode-button">Create an account</button>
    </div>

    <!-- JavaScript -->
    <script src="../script.js"></script>
  </body>
</html>
