<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login page</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="body-authPage">
    <!-- Login -->
    <div class="login-card">
      <h3>Log in to Digital Warerobe</h3>
      <form id="login-form" method="POST">
        <label for="login-username">Username</label>
        <input type="text" name="login-username" id="login-username" />
        <label for="login-password">Password</label>
        <input type="password" name="login-password" id="login-password" />

        <button class="submit" type="submit">Log In</button>
        <p class="auth-message login-message"></p>
      </form>
    </div>

    <!-- Register -->
    <div class="register-card hidden">
      <h3>Sign up to Digital Warerobe</h3>
      <form id="register-form" method="POST">
        <label for="register-username">Username</label>
        <input type="text" name="register-username" id="register-username" />
        <label for="register-password">Password</label>
        <input
          type="password"
          name="register-password"
          id="register-password"
        />
        <label for="confirm-password">Confirm password</label>
        <input
          type="password"
          name="register-confirm-password"
          id="register-confirm-password"
        />

        <button class="submit" type="submit">Create account</button>
        <p class="auth-message register-message"></p>
      </form>
    </div>

    <!-- Changing mode button -->
    <div class="auth-change-mode-section">
      <p>New to Digital Warerobe</p>
      <button class="auth-change-mode-button">Create an account</button>
    </div>

    <!-- JavaScript -->
    <script src="../script/script-auth.js"></script>
  </body>
</html>
